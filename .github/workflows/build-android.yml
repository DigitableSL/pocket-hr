name: Build Android APK / Play Store

on:
  push:
    branches:
      - domex
      - human-v2
    tags:
      - 'release-domex-v*'
      - 'release-malkey-v*'
      - 'release-mahajana-v*'
      - 'release-digitable-v*'
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Select tenant/flavor to build'
        required: true
        default: 'domex'
        type: choice
        options:
          - domex
          - malkey
          - mahajana
          - digitable
      build_format:
        description: 'Build format (apk for direct install, appbundle for Play Store, or both)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - both
      deploy_to_play_store:
        description: 'Upload AAB to Google Play Store track (requires Play Store & Keystore secrets)'
        required: false
        default: false
        type: boolean
      play_store_track:
        description: 'Google Play Store track'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  prepare:
    name: Resolve Build Configuration
    runs-on: ubuntu-latest
    outputs:
      tenant: ${{ steps.config.outputs.tenant }}
      target: ${{ steps.config.outputs.target }}
      format: ${{ steps.config.outputs.format }}
      deploy: ${{ steps.config.outputs.deploy }}
      track: ${{ steps.config.outputs.track }}
      package_name: ${{ steps.config.outputs.package_name }}
      build_number: ${{ steps.config.outputs.build_number }}
    steps:
      - name: Checkout pubspec.yaml
        uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml

      - name: Determine Tenant, Package Name, and Build Options
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TENANT="${{ github.event.inputs.tenant }}"
            FORMAT="${{ github.event.inputs.build_format }}"
            DEPLOY="${{ github.event.inputs.deploy_to_play_store }}"
            TRACK="${{ github.event.inputs.play_store_track }}"
          elif [[ "${{ github.ref }}" == refs/tags/release-* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Expected tag format: release-<tenant>-v<version> (optional -prod suffix)
            TENANT=$(echo "$TAG" | sed -E 's/^release-([a-z]+)-v.*/\1/')
            FORMAT="appbundle"
            DEPLOY="true"
            if [[ "$TAG" == *-prod ]]; then
              TRACK="production"
            else
              TRACK="internal"
            fi
          else
            TENANT="domex"
            FORMAT="apk"
            DEPLOY="false"
            TRACK="internal"
          fi

          # If deploying to Play Store, ensure appbundle is built
          if [ "$DEPLOY" = "true" ] && [ "$FORMAT" = "apk" ]; then
            FORMAT="both"
          fi

          # Use pubspec.yaml +buildNumber for Play Store releases; github.run_number for regular test builds
          BUILD_NUMBER="${{ github.run_number }}"
          if [ "$DEPLOY" = "true" ]; then
            PUBSPEC_BUILD=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -n 's/.*+\([0-9][0-9]*\).*/\1/p')
            if [ -n "$PUBSPEC_BUILD" ]; then
              BUILD_NUMBER="$PUBSPEC_BUILD"
            fi
          fi

          case "$TENANT" in
            domex)
              PACKAGE_NAME="io.digitable.go.domex.human"
              ;;
            malkey)
              PACKAGE_NAME="io.digitable.go.malkey.human"
              ;;
            mahajana)
              PACKAGE_NAME="io.digitable.go.mahajana.human"
              ;;
            digitable)
              PACKAGE_NAME="asia.ceynet.human.pocket"
              ;;
            *)
              PACKAGE_NAME="io.digitable.go.domex.human"
              ;;
          esac

          echo "tenant=$TENANT" >> $GITHUB_OUTPUT
          echo "target=lib/main_${TENANT}.dart" >> $GITHUB_OUTPUT
          echo "format=$FORMAT" >> $GITHUB_OUTPUT
          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT
          echo "track=$TRACK" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android (${{ needs.prepare.outputs.tenant }})
    needs: prepare
    environment: ${{ needs.prepare.outputs.tenant }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Configure Android Release Signing (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Configuring production release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found — falling back to debug-signed release build for easy device testing."
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK (Split per ABI)
        if: needs.prepare.outputs.format == 'apk' || needs.prepare.outputs.format == 'both'
        run: |
          flutter build apk --release \
            --split-per-abi \
            --tree-shake-icons \
            --android-skip-build-dependency-validation \
            --flavor ${{ needs.prepare.outputs.tenant }} \
            -t ${{ needs.prepare.outputs.target }} \
            --dart-define=tenant=${{ needs.prepare.outputs.tenant }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Upload APK Artifact (arm64-v8a)
        if: needs.prepare.outputs.format == 'apk' || needs.prepare.outputs.format == 'both'
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ needs.prepare.outputs.tenant }}-arm64-v8a-release-b${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-${{ needs.prepare.outputs.tenant }}-release.apk
          if-no-files-found: error

      - name: Build Release App Bundle (AAB) for Play Store
        if: needs.prepare.outputs.format == 'appbundle' || needs.prepare.outputs.format == 'both'
        run: |
          flutter build appbundle --release \
            --tree-shake-icons \
            --android-skip-build-dependency-validation \
            --flavor ${{ needs.prepare.outputs.tenant }} \
            -t ${{ needs.prepare.outputs.target }} \
            --dart-define=tenant=${{ needs.prepare.outputs.tenant }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Upload AAB Artifact
        if: needs.prepare.outputs.format == 'appbundle' || needs.prepare.outputs.format == 'both'
        uses: actions/upload-artifact@v7
        with:
          name: aab-${{ needs.prepare.outputs.tenant }}-release-b${{ github.run_number }}
          path: build/app/outputs/bundle/${{ needs.prepare.outputs.tenant }}Release/app-${{ needs.prepare.outputs.tenant }}-release.aab
          if-no-files-found: error

      - name: Verify Play Store Release Secrets
        if: needs.prepare.outputs.deploy == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Play Store rejects debug-signed AABs."
            exit 1
          fi
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_STORE_SERVICE_ACCOUNT_JSON secret is missing."
            exit 1
          fi

      - name: Deploy AAB to Google Play Console
        if: needs.prepare.outputs.deploy == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.prepare.outputs.package_name }}
          releaseFiles: build/app/outputs/bundle/${{ needs.prepare.outputs.tenant }}Release/app-${{ needs.prepare.outputs.tenant }}-release.aab
          tracks: ${{ needs.prepare.outputs.track }}
          status: completed

