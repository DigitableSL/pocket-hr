name: Build iOS IPA

on:
  push:
    tags:
      - 'ios-domex-v*'
      - 'ios-malkey-v*'
      - 'ios-mahajana-v*'
      - 'ios-digitable-v*'
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Select tenant/flavor to build'
        required: true
        default: 'domex'
        type: choice
        options:
          - domex
          - malkey
          - digitable
          - mahajana
      export_method:
        description: 'IPA Export Method'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store

jobs:
  prepare:
    name: Resolve iOS Build Configuration
    runs-on: ubuntu-latest
    outputs:
      tenant: ${{ steps.config.outputs.tenant }}
      target: ${{ steps.config.outputs.target }}
      export_method: ${{ steps.config.outputs.export_method }}
      build_name: ${{ steps.config.outputs.build_name }}
      build_number: ${{ steps.config.outputs.build_number }}
    steps:
      - name: Checkout pubspec.yaml
        uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml

      - name: Determine Tenant, Target, and Version
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TENANT="${{ github.event.inputs.tenant }}"
            EXPORT_METHOD="${{ github.event.inputs.export_method }}"
          elif [[ "${{ github.ref }}" == refs/tags/ios-* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TENANT=$(echo "$TAG" | sed -E 's/^ios-([a-z]+)-v.*/\1/')
            EXPORT_METHOD="app-store"
            if [[ "$TAG" == *-prod ]]; then
              TAG_CORE="${TAG%-prod}"
            else
              TAG_CORE="$TAG"
            fi
            VER_PART="${TAG_CORE#ios-${TENANT}-v}"
            if [[ "$VER_PART" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
              BUILD_NAME="${BASH_REMATCH[1]}"
              TAG_BUILD_NUM="${BASH_REMATCH[2]}"
            elif [[ "$VER_PART" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-b([0-9]+)$ ]]; then
              BUILD_NAME="${BASH_REMATCH[1]}"
              TAG_BUILD_NUM="${BASH_REMATCH[2]}"
            elif [[ "$VER_PART" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              BUILD_NAME="${BASH_REMATCH[1]}"
              TAG_BUILD_NUM=""
            fi
          else
            TENANT="domex"
            EXPORT_METHOD="development"
          fi

          PUBSPEC_LINE=$(grep -E '^version:' pubspec.yaml | head -n1)
          PUBSPEC_NAME=$(echo "$PUBSPEC_LINE" | sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p')
          PUBSPEC_BUILD=$(echo "$PUBSPEC_LINE" | sed -n 's/.*+\([0-9][0-9]*\).*/\1/p')

          if [ -z "${BUILD_NAME:-}" ]; then
            BUILD_NAME="${PUBSPEC_NAME:-1.0.0}"
          fi
          if [ -n "${TAG_BUILD_NUM:-}" ]; then
            BUILD_NUMBER="$TAG_BUILD_NUM"
          elif [[ "${{ github.ref }}" == refs/tags/ios-* ]]; then
            BASE_BUILD="${PUBSPEC_BUILD:-0}"
            BUILD_NUMBER=$((BASE_BUILD + ${{ github.run_number }}))
          else
            BUILD_NUMBER="${{ github.run_number }}"
          fi

          echo "tenant=$TENANT" >> $GITHUB_OUTPUT
          echo "target=lib/main_${TENANT}.dart" >> $GITHUB_OUTPUT
          echo "export_method=$EXPORT_METHOD" >> $GITHUB_OUTPUT
          echo "build_name=$BUILD_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

  build:
    name: Build iOS IPA (${{ needs.prepare.outputs.tenant }})
    needs: prepare
    environment: ${{ needs.prepare.outputs.tenant }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      NODE_OPTIONS: "--no-deprecation"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "::error::Missing iOS signing secrets (BUILD_CERTIFICATE_BASE64 or BUILD_PROVISION_PROFILE_BASE64) in environment '${{ needs.prepare.outputs.tenant }}' or repository secrets."
            exit 1
          fi

          # Define path variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 1. Strip whitespace and decode base64 strings into files
          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode > $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > $PP_PATH

          # 2. Create a temporary keychain (disable 5-min auto-lock so codesign never prompts)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 3. Import certificate to keychain and allow codesign without GUI prompt
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 4. Inspect provisioning profile, install by UUID, and configure Manual signing for CI
          PP_PLIST=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PP_PATH" > "$PP_PLIST"
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PP_PLIST")
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PP_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PP_PLIST")
          APP_ID_FULL=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PP_PLIST")
          PROFILE_BUNDLE_ID="${APP_ID_FULL#${TEAM_ID}.}"
          IS_DEV=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$PP_PLIST" 2>/dev/null || echo "false")
          HAS_DEVICES=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$PP_PLIST" >/dev/null 2>&1 && echo "true" || echo "false")

          if [ "$IS_DEV" = "true" ]; then
            CERT_IDENTITY="Apple Development"
            EXPORT_METHOD_PLIST="development"
          elif [ "$HAS_DEVICES" = "true" ]; then
            CERT_IDENTITY="Apple Distribution"
            EXPORT_METHOD_PLIST="ad-hoc"
          else
            CERT_IDENTITY="Apple Distribution"
            EXPORT_METHOD_PLIST="app-store-connect"
          fi

          echo "Profile Name: $PP_NAME"
          echo "Profile UUID: $PP_UUID"
          echo "Team ID: $TEAM_ID"
          echo "Profile Bundle ID: $PROFILE_BUNDLE_ID"
          echo "Detected Export Method: $EXPORT_METHOD_PLIST ($CERT_IDENTITY)"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${PP_UUID}.mobileprovision"

          # Switch Runner target from Automatic to Manual signing on the CI runner
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \"\";/PROVISIONING_PROFILE_SPECIFIER = \"${PP_NAME}\";/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${TEAM_ID};/g" ios/Runner.xcodeproj/project.pbxproj

          cat <<EOF >> ios/Flutter/Release.xcconfig
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=${TEAM_ID}
          CODE_SIGN_IDENTITY=${CERT_IDENTITY}
          PROVISIONING_PROFILE_SPECIFIER=${PP_NAME}
          EOF

          cat <<EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD_PLIST}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>${CERT_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${PROFILE_BUNDLE_ID}</key>
              <string>${PP_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Prepare Tenant iOS Assets and Config
        run: |
          chmod +x tooling/prepare_ios_flavor.sh
          ./tooling/prepare_ios_flavor.sh ${{ needs.prepare.outputs.tenant }}

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA
        run: |
          flutter config --no-enable-swift-package-manager || true
          flutter build ipa --release \
            --tree-shake-icons \
            -t ${{ needs.prepare.outputs.target }} \
            --dart-define=tenant=${{ needs.prepare.outputs.tenant }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --build-name=${{ needs.prepare.outputs.build_name }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ needs.prepare.outputs.tenant }}-${{ needs.prepare.outputs.export_method }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
